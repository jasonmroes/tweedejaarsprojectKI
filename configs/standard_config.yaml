# Basic structure co-opted from previous project
experiment_name: "DoT_standard"
seed: 42

data:
  dataset_type: "csv"
  data_path: "data/fully_preprocessed_data_AM_past.csv"
  future_data_path: "data/fully_preprocessed_data_AM_future.csv" #"data/future_data_AM.csv" # Weather forecasts, already known reservations..
  incoming_raw_data_path: "data/incoming_data.csv"
  weather_file: "data/WeatherAmsterdam.csv"

  reservations_file: "data/extern/mollie-all-payments.csv"
  sales_file: "data/extern/untill_exports_sales_area.csv"
  
  
  



  # If the data split is dynamic, not fixed during pre processing
  validation_fraction: 0.2
  test_fraction: 0.1

  past_covariates: ['national holiday','walk-in', 'day of week', 'temp_avg','temp_min','temp_max','rain_mm','sun_hours','wind_avg','cloud','humidity'] # Columns of data other than price and time that historically influence the price at a certain time
  future_covariates: [] # Columns of data other than price and time that will influence the price at a certain time


# Model configuration
model:
  input_chunk_length:  96
  output_chunk_length: 24

  # Architecture
  hidden_dims: [512, 512, 256]  # Hidden layer dimensions
  dropout: 0.3
  use_batch_norm: true
  activation: "relu"  # Options: relu, gelu, leaky_relu, elu, silu

  # Loss function configuration
  # Acceptable entries are: CrossEntropyLoss, BCEWithLogitsLoss, MSELoss, L1Loss, SmoothL1Loss, KLDivLoss, PoissonNLLLoss
  criterion: CrossEntropyLoss
  use_class_weights: true  # Weight classes inversely proportional to frequency 


training:
  epochs: 50
  learning_rate: 1e-4
  batch_size: 32

  save_dir: "./experiments/results"

  # Logging granularity (steps)
  granularity: 100
  weight_decay: 0.01  # Reduced from 0.05 to prevent over-regularization

  scheduler:
    # Class name (case-insensitive).
    # Supported: steplr (default), multisteplr, cosineannealinglr,
    #            reducelronplateau, exponentiallr
    type: "reducelronplateau"
 
    # StepLR params:
    # step_size: 5
    # gamma: 0.1
 
    # MultiStepLR example (swap type above and uncomment):
    # milestones: [10, 25, 40]
    # gamma: 0.1
 
    # CosineAnnealingLR example:
    # T_max: 50
    # eta_min: 1.0e-6
 
    # ReduceLROnPlateau example:
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6