# Basic structure co-opted from previous project
experiment_name: "GRU_experiment"
seed: 42

data:
  dataset_type: "csv"
  data_path: "data/fully_preprocessed_data_AM_past.csv"
  future_data_path: "data/fully_preprocessed_data_AM_past.csv" #"data/future_data_AM.csv" # Weather forecasts, already known reservations..

  # If the data split is dynamic, not fixed during pre processing
  validation_fraction: 0.2
  test_fraction: 0.1

  # Weekly cycle repetition: number of times to repeat the 7-day pattern (each cycle = 168 hours)
  repeat_cycles: 3  # 4 cycles = 4 weeks of data, with repeating day-of-week + hour patterns

  past_covariates: ['national holiday','walk-in', 'month', 'day of week', 'temp_avg','temp_min','temp_max','rain_mm','sun_hours','wind_avg','cloud','humidity'] # Columns of data other than price and time that historically influence the price at a certain time
  # NOTE: during training, the weather columns below (temp_avg, rain_mm, sun_hours) are
  # loaded as *realized/observed* values from the historical CSV, not as forecasts.
  # At real inference time only a weather forecast (with its own error) would be
  # available, so the model is trained with more certainty about the future than
  # it will actually have in production. Accepted limitation, not a bug.
  future_covariates: ['temp_avg', 'national holiday', 'month', 'day of week', 'rain_mm', 'sun_hours'] # Columns of data other than price and time that will influence the price at a certain time


# Model configuration 
model:
  # Which darts model? Valid options are (exactly):
  # NaiveSeasonal,NaiveDrift,NaiveMovingAverage,NaiveEnsembleModel,ExponentialSmoothing,
  # StatsForecastModel,TBATS,Theta,FourTheta,FFT, AutoARIMA,Prophet,KalmanForecaster,RegressionModel,
  # RandomForest,LightGBMModel,XGBModel,CatBoostModel,Croston,LinearRegressionModel,
  # And NN Models:
  # ?RNNModel?, BlockRNNModel, NBEATSModel, NHiTSModel, TCNModel, TransformerModel,TFTModel,TiDEModel,
 
  model_cls: 'RNNModel'
  model: "GRU"
  resume: False # Set to true if you want to resume training from a previous checkpoint. Checkpoint FOLDER to be continued from should be at filepath [save_dir]/[config_name]
   # RNNModel in Darts REQUIRES output_chunk_length = 1
  # It autoregressively rolls forward to produce multi-step forecasts
  input_chunk_length: 336    # ~2 weeks of hourly history; longer context helps GRU
  output_chunk_length: 1     # MUST be 1 for RNNModel in Darts — non-negotiable
  training_length: 337
  hidden_dim: 128            # Up from 16; gives the GRU enough capacity
  n_rnn_layers: 2            # Two stacked GRU layers for better temporal abstraction
  dropout: 0.2               # Slightly higher to counteract increased capacity
  
  criterion: MSELoss
  training_length: 672       # input_chunk_length + output_chunk_length * steps; set >= input_chunk_length

  use_class_weights: false  # Not applicable for regression tasks 


training:
  epochs: 50
  learning_rate: 1e-4
  batch_size: 32
  num_workers: 8


  save_dir: "./experiments/results/rnn_gru"
  soft_clip_margin: 0.08  # scaled-space margin beyond [0,1] before predictions are softly saturated

  # Logging granularity (steps)
  granularity: 100
  weight_decay: 0.01  # Reduced from 0.05 to prevent over-regularization

  scheduler:
    # Class name (case-insensitive).
    # Supported: steplr (default), multisteplr, cosineannealinglr,
    #            reducelronplateau, exponentiallr
    type: "reducelronplateau"
 
    # StepLR params:
    # step_size: 5
    # gamma: 0.1
 
    # MultiStepLR example (swap type above and uncomment):
    # milestones: [10, 25, 40]
    # gamma: 0.1
 
    # CosineAnnealingLR example:
    # T_max: 50
    # eta_min: 1.0e-6
 
    # ReduceLROnPlateau example:
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6

# ── TensorBoard ───────────────────────────────────────────────────────────────
# Only applied when the chosen MODEL_CLS is a TorchForecastingModel subclass.
# To launch:  tensorboard --logdir <log_dir>
tensorboard:
  enabled: true
  log_dir: "experiments/tb_logs"   # root folder; a subfolder per experiment_name
                                    # is created automatically
 
  # How often (in training steps) to write scalar logs.
  # Lower = more granular loss curve; higher = less I/O overhead.
  # Falls back to training.granularity if absent.
  log_every_n_steps: 50

  val_metrics: ["smape", "rmse", "mae"]