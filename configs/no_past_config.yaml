# Basic structure co-opted from previous project
experiment_name: "DoT_no_past"
seed: 42

data:
  dataset_type: "csv"
  data_path: "data/past_data_AM.csv"
  future_data_path: "data/future3days_data_AM.csv" # Weather forecasts, already known reservations..

  # If the data split is dynamic, not fixed during pre processing
  validation_fraction: 0.2
  test_fraction: 0.1

  past_covariates: [] # Columns of data other than price and time that historically influence the price at a certain time
  future_covariates: [] # Columns of data other than price and time that will influence the price at a certain time


# Model configuration
model:
  input_chunk_length:  96
  output_chunk_length: 24

  # Architecture
  hidden_dim: 256  # Hidden layer size
  num_layers: 2
  num_attention_heads: 4
  use_reversible_instance_norm: false   # NHiTS / TiDE


  dropout: 0.3  # Dropout rate
  activation: "relu"  # Options: relu, gelu, leaky_relu, elu, silu, tanh

  # Loss function configuration
  # Acceptable entries are: CrossEntropyLoss, BCEWithLogitsLoss, MSELoss, L1Loss, SmoothL1Loss, KLDivLoss, PoissonNLLLoss
  criterion: CrossEntropyLoss
  use_class_weights: true  # Weight classes inversely proportional to frequency 


training:
  epochs: 50                  # → n_epochs
  batch_size: 32              # takes priority over data.batch_size
  learning_rate: 1.0e-4       # → optimizer_kwargs["lr"]
  weight_decay: 0.01          # → optimizer_kwargs["weight_decay"]
 
  # Optimizer class name (case-insensitive).
  # Supported: adam, adamw (default), sgd, rmsprop
  optimizer: "adamw"

  # Logging granularity (steps)
  granularity: 100
  weight_decay: 0.01  # Reduced from 0.05 to prevent over-regularization


  save_dir: "./experiments/results"
    # Class name (case-insensitive).
    # Supported: steplr (default), multisteplr, cosineannealinglr,
    #            reducelronplateau, exponentiallr
  
  scheduler:
    # Class name (case-insensitive).
    # Supported: steplr (default), multisteplr, cosineannealinglr,
    #            reducelronplateau, exponentiallr
    type: "reducelronplateau"
 
    # StepLR params:
    # step_size: 5
    # gamma: 0.1
 
    # MultiStepLR example (swap type above and uncomment):
    # milestones: [10, 25, 40]
    # gamma: 0.1
 
    # CosineAnnealingLR example:
    # T_max: 50
    # eta_min: 1.0e-6
 
    # ReduceLROnPlateau example:
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6
